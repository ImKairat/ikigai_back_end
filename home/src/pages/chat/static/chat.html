<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IkigAI chat</title>
    <link rel="stylesheet" href="./chat_static/chat_style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }
        .chat-box {
            height: 300px;
            padding: 10px;
            overflow-y: auto;
            background: #ecf0f1;
            border-bottom: 1px solid #bdc3c7;
        }
        .chat-input-container {
            display: flex;
            padding: 10px;
            background: white;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>IkigAI</h1>
    </div>

    <div class="chat-box" id="chat-box">
        <!-- Messages will appear here -->
    </div>

    <div class="chat-input-container">
        <label for="user-input"></label>
        <input type="text" id="user-input" placeholder="Введите сообщение..." autocomplete="off">
        <button id="send-button">Отправить</button>
    </div>
</div>

<script src="./chat_static/chat_script.js"></script>
</body>
</html>
